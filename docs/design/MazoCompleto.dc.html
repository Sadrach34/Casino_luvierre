<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu mazo completo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;font-family:'Pixelify Sans',ui-monospace,monospace;color:#dfeae4;background-color:#0a0806;background-image:url("/_blob/9eb210e033e27fef99b3b1dc11476e9d"),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%);background-size:256px 256px,64px 64px,64px 64px;background-position:0 0,0 0,32px 32px}
.stage h1,.stage h2,.stage h3,.stage p{margin:0;font-weight:inherit}
.bunting{position:absolute;top:0;left:0;right:0;z-index:3;height:24px;background:linear-gradient(#cf9b38,#cf9b38) 0 0/100% 6px no-repeat,conic-gradient(from -45deg at bottom,#cf9b38 90deg,transparent 0) 0 6px/32px 18px repeat-x}
.panel{background:#15100a;border:3px solid #cf9b38;box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;box-sizing:border-box;font-family:inherit;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;background:#cf9b38;color:#0a0806;box-shadow:inset -4px -4px 0 #9a6f1f,inset 4px 4px 0 #f0cf7a,0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.7)}
.btn:focus-visible{outline:3px solid #dfeae4;outline-offset:5px}
.btn-ghost{background:#211910;color:#ecc062;box-shadow:inset -4px -4px 0 #0a0806,inset 4px 4px 0 #3a2c18,0 0 0 3px #cf9b38,5px 5px 0 3px rgba(0,0,0,.7)}
.btn-ghost:hover{background:#2b2014}
.label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#b9a780}
.kbd{font-size:13px;padding:3px 6px;border:2px solid #7a5a1e;color:#ecc062;line-height:1;letter-spacing:.1em}
.spr{position:relative;flex:none;display:block;width:calc(48px*var(--s,3));height:calc(64px*var(--s,3));background-image:var(--spr);background-repeat:no-repeat;background-size:calc(var(--sw)*var(--s,3)) calc(var(--sh)*var(--s,3));background-position:calc(var(--col,0)*-48px*var(--s,3)) calc(var(--row,0)*-64px*var(--s,3));image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.65))}
.cd{--s:1.25;--spr:url("/_blob/c3fdfeb0d0abb6a3af9bd7e5a721b005");--sw:624px;--sh:256px}
.oscuro .cd{--spr:url("/_blob/f139bd582298bcde19d0c4ec899fae94")}
.c0{--col:0}.c1{--col:1}.c2{--col:2}.c3{--col:3}.c4{--col:4}.c5{--col:5}.c6{--col:6}.c7{--col:7}.c8{--col:8}.c9{--col:9}.c10{--col:10}.c11{--col:11}.c12{--col:12}
.w0{--row:0}.w1{--row:1}.w2{--row:2}.w3{--row:3}
.poly::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ff4d7d,#ffc247,#5cf2a0,#4db8ff,#b56cff,#ff4d7d);background-size:200% 200%;mix-blend-mode:color;opacity:.85;-webkit-mask-image:var(--spr);mask-image:var(--spr);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:calc(var(--sw)*var(--s,3)) calc(var(--sh)*var(--s,3));mask-size:calc(var(--sw)*var(--s,3)) calc(var(--sh)*var(--s,3));-webkit-mask-position:calc(var(--col,0)*-48px*var(--s,3)) calc(var(--row,0)*-64px*var(--s,3));mask-position:calc(var(--col,0)*-48px*var(--s,3)) calc(var(--row,0)*-64px*var(--s,3));animation:poly 3.2s ease-in-out infinite alternate;pointer-events:none}
@keyframes poly{from{background-position:0 0}to{background-position:100% 100%}}
.seal{position:absolute;left:-6px;bottom:-6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#0a0806;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);z-index:2}
.seal::before{content:"";position:absolute;inset:3px;background:#5fbf6a;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.dim{position:absolute;inset:0;z-index:10;background:rgba(5,4,2,.8)}
.modal{position:absolute;z-index:20;left:64px;top:48px;width:1152px;box-sizing:border-box;padding:22px 30px 24px;display:flex;flex-direction:column;gap:16px}
.srow{display:flex;align-items:center;gap:20px;min-height:84px}
.sname{width:132px;flex:none;display:flex;flex-direction:column;gap:2px}
.cards{flex:1;min-width:0;display:flex;justify-content:center;gap:8px}
.slot{position:relative;width:60px;height:80px;flex:none;display:flex;align-items:center;justify-content:center}
.slot.su .spr{filter:grayscale(1) brightness(.5);transform:scale(.78)}
.miss{width:60px;height:80px;flex:none;box-sizing:border-box;border:2px dashed #4a3a1c;display:flex;align-items:center;justify-content:center;color:#4a3a1c;font-size:22px;font-weight:700}
.gonerow{flex:1;height:80px;box-sizing:border-box;border:2px dashed #7b2536;background:repeating-linear-gradient(45deg,#1a0a0e 0 10px,#140a0c 10px 20px);display:flex;align-items:center;justify-content:center;color:#e8705f;font-size:18px}
.lg{display:flex;align-items:center;gap:8px;font-size:15px;color:#b9a780}
</style>
</helmet>
<div class="stage {{deckCls}}">
  <div class="bunting"></div>
  <div class="dim" aria-hidden="true"></div>

  <section class="panel modal" role="dialog" aria-modal="true" aria-labelledby="mz-title">
    <header style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="label">{{momento}}</span>
        <h1 id="mz-title" style="font-size:40px;line-height:1;font-weight:700;color:#cf9b38;text-shadow:0 4px 0 #7a5a1e,5px 7px 0 #000">TU MAZO</h1>
      </div>
      <div style="display:flex;align-items:center;gap:24px">
        <div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-size:30px;font-weight:700;color:#ecc062;line-height:1">{{total}}</span><span class="label">de 52 cartas</span></div>
        <a class="btn btn-ghost" href="Mesa.dc.html" style="min-height:48px;font-size:18px;padding:0 16px">Cerrar <span class="kbd">ESC</span></a>
      </div>
    </header>

    <div style="display:flex;gap:28px;flex-wrap:wrap">
      <sc-if value="{{enPartida}}" hint-placeholder-val="{{true}}"><span class="lg"><span style="width:16px;height:20px;background:#5a5a5a;display:inline-block"></span>Gris y pequeña: ya salió en esta ronda</span></sc-if>
      <span class="lg"><span style="width:16px;height:16px;background:#5fbf6a;display:inline-block;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)"></span>Sello de efecto</span>
      <span class="lg"><span style="width:16px;height:16px;background:linear-gradient(115deg,#ff4d7d,#ffc247,#5cf2a0,#4db8ff,#b56cff);display:inline-block"></span>Policromo</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
        <div class="srow">
          <div class="sname"><span style="font-size:22px;font-weight:700;line-height:1">{{row.name}}</span><span class="label" style="font-size:12px">{{row.count}}</span></div>
          <sc-if value="{{row.has}}" hint-placeholder-val="{{true}}">
            <div class="cards">
              <sc-for list="{{row.cards}}" as="cd" hint-placeholder-count="13">
                <sc-if value="{{cd.present}}" hint-placeholder-val="{{true}}"><span class="{{cd.slot}}" role="img" aria-label="{{cd.aria}}"><span class="{{cd.cls}}"><sc-if value="{{cd.seal}}" hint-placeholder-val="{{false}}"><span class="seal"></span></sc-if></span></span></sc-if>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palo":{"editor":"enum","options":["Ninguno","Tréboles","Corazones","Picas","Diamantes"],"default":"Diamantes","section":"Ejemplo"},"momento":{"editor":"enum","options":["En partida","Fuera de partida"],"default":"En partida","section":"Ejemplo"},"mazo":{"editor":"enum","options":["Claro","Oscuro"],"default":"Claro","section":"Cartas"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const suits = ['Tréboles', 'Corazones', 'Picas', 'Diamantes'];
    const ranks = ['As', 'Dos', 'Tres', 'Cuatro', 'Cinco', 'Seis', 'Siete', 'Ocho', 'Nueve', 'Diez', 'Jota', 'Reina', 'Rey'];
    const removed = this.props.palo ?? 'Diamantes';
    const enPartida = (this.props.momento ?? 'En partida') === 'En partida';
    const missing = ['11,1', '4,2', '7,0'];
    const used = ['12,2', '5,1', '1,0', '6,2', '9,1'];
    const fx = { '12,2': 'poly seal', '0,0': 'seal', '2,0': 'poly', '4,1': 'poly', '9,3': 'seal' };
    let total = 0;
    const rows = suits.map((name, r) => {
      const gone = name === removed;
      let have = 0;
      const cards = ranks.map((rank, c) => {
        const key = c + ',' + r;
        const miss = missing.indexOf(key) >= 0;
        const u = enPartida && used.indexOf(key) >= 0;
        const f = fx[key] || '';
        if (!miss) have++;
        return {
          present: !miss,
          missing: miss,
          slot: 'slot' + (u ? ' su' : ''),
          cls: 'spr cd c' + c + ' w' + r + (f.indexOf('poly') >= 0 ? ' poly' : ''),
          seal: f.indexOf('seal') >= 0,
          aria: rank + ' de ' + name.toLowerCase() + (miss ? ', ya no está en tu mazo' : '') + (u ? ', ya salió en esta ronda' : '')
        };
      });
      if (!gone) total += have;
      return { name: name, goneTxt: 'Ya no tienes ' + name.toLowerCase() + ': los vendiste o destruiste todos', has: !gone, gone: gone, count: gone ? '0 de 13' : have + ' de 13', cards: cards };
    });
    return {
      rows: rows,
      total: total,
      enPartida: enPartida,
      momento: enPartida ? 'Mesa 1 · en partida' : 'Fuera de partida',
      deckCls: (this.props.mazo ?? 'Claro') === 'Oscuro' ? 'oscuro' : ''
    };
  }
}
</script>
</body>
</html>
