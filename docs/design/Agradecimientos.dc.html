<style>
body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;font-family:'Pixelify Sans',ui-monospace,monospace;color:#dfeae4;background-color:#0a0806;background-image:url("/_blob/9eb210e033e27fef99b3b1dc11476e9d"),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%);background-size:256px 256px,64px 64px,64px 64px;background-position:0 0,0 0,32px 32px}
.stage h1,.stage h2,.stage h3,.stage p{margin:0;font-weight:inherit}
.bunting{position:absolute;top:0;left:0;right:0;z-index:3;height:24px;background:linear-gradient(#cf9b38,#cf9b38) 0 0/100% 6px no-repeat,conic-gradient(from -45deg at bottom,#cf9b38 90deg,transparent 0) 0 6px/32px 18px repeat-x}
.panel{background:#15100a;border:3px solid #cf9b38;box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;box-sizing:border-box;font-family:inherit;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;background:#cf9b38;color:#0a0806;box-shadow:inset -4px -4px 0 #9a6f1f,inset 4px 4px 0 #f0cf7a,0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.7)}
.btn:focus-visible{outline:3px solid #dfeae4;outline-offset:5px}
.btn-ghost{background:#211910;color:#ecc062;box-shadow:inset -4px -4px 0 #0a0806,inset 4px 4px 0 #3a2c18,0 0 0 3px #cf9b38,5px 5px 0 3px rgba(0,0,0,.7)}
.btn-ghost:hover{background:#2b2014}
.label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#b9a780}
.kbd{font-size:13px;padding:3px 6px;border:2px solid #7a5a1e;color:#ecc062;line-height:1;letter-spacing:.1em}
.dim{position:absolute;inset:0;z-index:10;background:rgba(5,4,2,.8)}
.modal{position:absolute;z-index:20;left:290px;top:70px;width:700px;box-sizing:border-box;padding:24px 34px 30px;display:flex;flex-direction:column;gap:22px}
.who{display:flex;align-items:center;gap:18px;padding:16px 18px;background:#100c07;border:2px solid #3a2c18}
.av{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;background:#211910;border:3px solid #cf9b38;color:#ecc062;font-size:30px;font-weight:700}
</style>
</helmet>
<div class="stage">
  <div class="bunting"></div>
  <img src="/_blob/9da685e417e34915e7da9500feaf3f82" alt="" style="position:absolute;left:30px;bottom:0;height:560px;width:auto;opacity:.45">
  <div class="dim" aria-hidden="true"></div>

  <section class="panel modal" role="dialog" aria-modal="true" aria-labelledby="ag-title">
    <header style="display:flex;align-items:center;justify-content:space-between">

      <a class="btn btn-ghost" href="Configuracion.dc.html" style="min-height:48px;font-size:18px;padding:0 16px">Volver <span class="kbd">ESC</span></a>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="who">
        <span class="av" aria-hidden="true">1</span>
        <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:28px;font-weight:700;line-height:1">Persona 1</span><span class="label">[Rol o aporte]</span></div>
      </div>
      <div class="who">
        <span class="av" aria-hidden="true">2</span>
        <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:28px;font-weight:700;line-height:1">Persona 2</span><span class="label">[Rol o aporte]</span></div>
      </div>
    </div>

    <p style="font-size:17px;line-height:1.3;text-align:center;color:#ecc062;padding-top:16px;border-top:2px dashed #3a2c18">…y a ti, por sentarte a jugar.</p>
