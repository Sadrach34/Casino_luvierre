<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Configuración</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;font-family:'Pixelify Sans',ui-monospace,monospace;color:#dfeae4;background-color:#0a0806;background-image:url("/_blob/9eb210e033e27fef99b3b1dc11476e9d"),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%);background-size:256px 256px,64px 64px,64px 64px;background-position:0 0,0 0,32px 32px}
.stage h1,.stage h2,.stage h3,.stage p{margin:0;font-weight:inherit}
.bunting{position:absolute;top:0;left:0;right:0;z-index:3;height:24px;background:linear-gradient(#cf9b38,#cf9b38) 0 0/100% 6px no-repeat,conic-gradient(from -45deg at bottom,#cf9b38 90deg,transparent 0) 0 6px/32px 18px repeat-x}
.panel{background:#15100a;border:3px solid #cf9b38;box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;box-sizing:border-box;font-family:inherit;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;background:#cf9b38;color:#0a0806;box-shadow:inset -4px -4px 0 #9a6f1f,inset 4px 4px 0 #f0cf7a,0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.7)}
.btn:hover{background:#e0ad46}
.btn:focus-visible{outline:3px solid #dfeae4;outline-offset:5px}
.btn-ghost{background:#211910;color:#ecc062;box-shadow:inset -4px -4px 0 #0a0806,inset 4px 4px 0 #3a2c18,0 0 0 3px #cf9b38,5px 5px 0 3px rgba(0,0,0,.7)}
.btn-ghost:hover{background:#2b2014}
.btn-wine{background:#7b2536;color:#f3c9c2;box-shadow:inset -4px -4px 0 #4f1623,inset 4px 4px 0 #a33a4f,0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.7)}
.btn-wine:hover{background:#8d2c40}
.label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#b9a780}
.kbd{font-size:13px;padding:3px 6px;border:2px solid #7a5a1e;color:#ecc062;line-height:1;letter-spacing:.1em}
.spr{position:relative;flex:none;display:block;width:calc(48px*var(--s,3));height:calc(64px*var(--s,3));background-image:var(--spr);background-repeat:no-repeat;background-size:calc(var(--sw)*var(--s,3)) calc(var(--sh)*var(--s,3));background-position:calc(var(--col,0)*-48px*var(--s,3)) calc(var(--row,0)*-64px*var(--s,3));image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.65))}
.cd{--spr:url("/_blob/c3fdfeb0d0abb6a3af9bd7e5a721b005");--sw:624px;--sh:256px}
.oscuro .cd{--spr:url("/_blob/f139bd582298bcde19d0c4ec899fae94")}
.jk{--spr:url("/_blob/e43ea6237996aacaca58fe6b0f8bb5c0");--sw:96px;--sh:64px}
.oscuro .jk{--spr:url("/_blob/507f130c5d0337cce8a1efee24cdb017")}
.bk{--spr:url("/_blob/b787f4a8389bb82c9420ebd0935a4b56");--sw:240px;--sh:64px;--row:0}
.dim{position:absolute;inset:0;z-index:10;background:rgba(5,4,2,.78)}
.modal{position:absolute;z-index:20;left:190px;top:48px;width:900px;box-sizing:border-box;padding:24px 30px 26px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;flex:1;padding:12px 14px;box-sizing:border-box;font-family:inherit;color:#dfeae4;background:#15100a;border:3px solid #4a3a1c;cursor:pointer;text-align:left}
.opt:hover{border-color:#7a5a1e}
.opt:focus-visible{outline:3px solid #dfeae4;outline-offset:3px}
.opt.on{border-color:#cf9b38;background:#211910}
.fan{position:relative;height:90px;width:150px}
.fan .spr{position:absolute;bottom:0}
.back{display:block;padding:4px;margin:0;border:3px solid transparent;background:none;cursor:pointer}
.back:hover{border-color:#7a5a1e}
.back:focus-visible{outline:3px solid #dfeae4;outline-offset:2px}
.back.on{border-color:#ecc062}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
.rng{width:220px;accent-color:#cf9b38;height:28px;cursor:pointer}
.seg{display:flex;border:3px solid #4a3a1c}
.sg{min-height:44px;padding:0 16px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#b9a780;background:#15100a;border:0;border-right:3px solid #4a3a1c;cursor:pointer}
.sg:last-child{border-right:0}
.sg.on{background:#cf9b38;color:#0a0806}
.sg:focus-visible{outline:3px solid #dfeae4;outline-offset:2px}
.sw{position:relative;width:60px;height:32px;flex:none;padding:0;box-sizing:border-box;background:#0a0806;border:3px solid #4a3a1c;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#4a3a1c}
.sw.on{border-color:#cf9b38}
.sw.on::after{left:31px;background:#cf9b38}
.sw:focus-visible{outline:3px solid #dfeae4;outline-offset:3px}
</style>
</helmet>
<div class="stage">
  <div class="bunting"></div>
  <img src="/_blob/86f2005ee589e8559236e3c418719b5e" alt="" style="position:absolute;right:40px;bottom:0;height:560px;width:auto;opacity:.5">
  <div class="dim" aria-hidden="true"></div>

  <section class="panel modal" role="dialog" aria-modal="true" aria-labelledby="cfg-title">
    <header style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="label">Pausa</span>
        <h1 id="cfg-title" style="font-size:40px;line-height:1;font-weight:700;color:#cf9b38;text-shadow:0 4px 0 #7a5a1e,5px 7px 0 #000">CONFIGURACIÓN</h1>
      </div>
      <a class="btn btn-ghost" href="Mesa.dc.html" style="min-height:48px;font-size:18px;padding:0 16px">Cerrar <span class="kbd">ESC</span></a>
    </header>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="sec">
          <span class="label">Diseño de cartas</span>
          <div style="display:flex;gap:14px">
            <button type="button" class="{{optClaro}}" onClick="{{pickClaro}}" aria-pressed="{{isClaro}}">
              <span class="fan" aria-hidden="true">
                <span class="spr cd" style="--s:1.25;--col:0;--row:2;left:0;transform:rotate(-8deg)"></span>
                <span class="spr cd" style="--s:1.25;--col:12;--row:1;left:42px;transform:rotate(1deg)"></span>
                <span class="spr jk" style="--s:1.25;--col:0;left:84px;transform:rotate(9deg)"></span>
              </span>
              <span style="display:flex;flex-direction:column"><span style="font-size:20px;font-weight:700">Clásico</span><span style="font-size:14px;color:#b9a780">Cartas claras</span></span>
            </button>
            <button type="button" class="{{optOscuro}}" onClick="{{pickOscuro}}" aria-pressed="{{isOscuro}}">
              <span class="fan oscuro" aria-hidden="true">
                <span class="spr cd" style="--s:1.25;--col:0;--row:2;left:0;transform:rotate(-8deg)"></span>
                <span class="spr cd" style="--s:1.25;--col:12;--row:1;left:42px;transform:rotate(1deg)"></span>
                <span class="spr jk" style="--s:1.25;--col:0;left:84px;transform:rotate(9deg)"></span>
              </span>
              <span style="display:flex;flex-direction:column"><span style="font-size:20px;font-weight:700">Nocturno</span><span style="font-size:14px;color:#b9a780">Cartas oscuras</span></span>
            </button>
          </div>
        </div>
        <div class="sec">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">Reverso</span><span style="font-size:15px;color:#ecc062">{{revName}}</span></div>
          <div style="display:flex;gap:10px">
            <button type="button" class="{{b0.cls}}" onClick="{{b0.pick}}" aria-pressed="{{b0.on}}" aria-label="Reverso verde"><span class="spr bk" style="--s:1.25;--col:0"></span></button>
            <button type="button" class="{{b1.cls}}" onClick="{{b1.pick}}" aria-pressed="{{b1.on}}" aria-label="Reverso rojo"><span class="spr bk" style="--s:1.25;--col:1"></span></button>
            <button type="button" class="{{b2.cls}}" onClick="{{b2.pick}}" aria-pressed="{{b2.on}}" aria-label="Reverso gris"><span class="spr bk" style="--s:1.25;--col:2"></span></button>
            <button type="button" class="{{b3.cls}}" onClick="{{b3.pick}}" aria-pressed="{{b3.on}}" aria-label="Reverso azul"><span class="spr bk" style="--s:1.25;--col:3"></span></button>
            <button type="button" class="{{b4.cls}}" onClick="{{b4.pick}}" aria-pressed="{{b4.on}}" aria-label="Reverso negro"><span class="spr bk" style="--s:1.25;--col:4"></span></button>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="sec">
          <span class="label">Audio</span>
          <div class="row"><label for="cfg-music" style="font-size:19px">Música</label><span style="display:flex;align-items:center;gap:12px"><input id="cfg-music" class="rng" type="range" min="0" max="100" value="{{music}}" onInput="{{setMusic}}"><span style="width:36px;text-align:right;color:#ecc062;font-size:18px">{{music}}</span></span></div>
          <div class="row"><label for="cfg-sfx" style="font-size:19px">Efectos</label><span style="display:flex;align-items:center;gap:12px"><input id="cfg-sfx" class="rng" type="range" min="0" max="100" value="{{sfx}}" onInput="{{setSfx}}"><span style="width:36px;text-align:right;color:#ecc062;font-size:18px">{{sfx}}</span></span></div>
        </div>
        <div class="sec">
          <span class="label">Juego</span>
          <div class="row"><span style="font-size:19px">Velocidad</span>
            <div class="seg" role="group" aria-label="Velocidad del juego">
              <button type="button" class="{{v0.cls}}" onClick="{{v0.pick}}" aria-pressed="{{v0.on}}">Normal</button>
              <button type="button" class="{{v1.cls}}" onClick="{{v1.pick}}" aria-pressed="{{v1.on}}">Rápida</button>
              <button type="button" class="{{v2.cls}}" onClick="{{v2.pick}}" aria-pressed="{{v2.on}}">Turbo</button>
            </div>
          </div>
          <div class="row"><span id="t-dlg" style="font-size:19px">Diálogos de los dealers</span><button type="button" role="switch" class="{{t0.cls}}" onClick="{{t0.flip}}" aria-checked="{{t0.on}}" aria-labelledby="t-dlg"></button></div>
          <div class="row"><span id="t-anim" style="font-size:19px">Animación de cartas</span><button type="button" role="switch" class="{{t1.cls}}" onClick="{{t1.flip}}" aria-checked="{{t1.on}}" aria-labelledby="t-anim"></button></div>
          <div class="row"><span id="t-full" style="font-size:19px">Pantalla completa</span><button type="button" role="switch" class="{{t2.cls}}" onClick="{{t2.flip}}" aria-checked="{{t2.on}}" aria-labelledby="t-full"></button></div>
        </div>
      </div>
    </div>

    <footer style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-top:18px;border-top:2px dashed #3a2c18">
      <a class="btn btn-wine" href="Main.dc.html" style="height:52px;font-size:19px">Abandonar partida</a>
      <a class="btn btn-ghost" href="Agradecimientos.dc.html" style="height:52px;font-size:19px">Agradecimientos</a>
      <a class="btn" href="Mesa.dc.html" style="height:56px;width:260px;font-size:24px">Reanudar</a>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mazo: 'claro', rev: 1, music: 70, sfx: 85, speed: 0, toggles: [true, true, false] };
  }
  renderVals() {
    const s = this.state;
    const revNames = ['Verde', 'Rojo', 'Gris', 'Azul', 'Negro'];
    const v = {
      optClaro: 'opt' + (s.mazo === 'claro' ? ' on' : ''),
      optOscuro: 'opt' + (s.mazo === 'oscuro' ? ' on' : ''),
      isClaro: s.mazo === 'claro' ? 'true' : 'false',
      isOscuro: s.mazo === 'oscuro' ? 'true' : 'false',
      pickClaro: () => this.setState({ mazo: 'claro' }),
      pickOscuro: () => this.setState({ mazo: 'oscuro' }),
      revName: revNames[s.rev],
      music: s.music,
      sfx: s.sfx,
      setMusic: (e) => this.setState({ music: Number(e.target.value) }),
      setSfx: (e) => this.setState({ sfx: Number(e.target.value) })
    };
    for (let k = 0; k < 5; k++) {
      v['b' + k] = { cls: 'back' + (s.rev === k ? ' on' : ''), on: s.rev === k ? 'true' : 'false', pick: () => this.setState({ rev: k }) };
    }
    for (let k = 0; k < 3; k++) {
      v['v' + k] = { cls: 'sg' + (s.speed === k ? ' on' : ''), on: s.speed === k ? 'true' : 'false', pick: () => this.setState({ speed: k }) };
      const on = s.toggles[k];
      v['t' + k] = {
        cls: 'sw' + (on ? ' on' : ''),
        on: on ? 'true' : 'false',
        flip: () => { const t = this.state.toggles.slice(); t[k] = !t[k]; this.setState({ toggles: t }); }
      };
    }
    return v;
  }
}
</script>
</body>
</html>
