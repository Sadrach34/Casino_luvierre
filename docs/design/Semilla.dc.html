<style>
body{margin:0;background:#000}
.stage{position:relative;width:1280px;height:720px;overflow:hidden;box-sizing:border-box;font-family:'Pixelify Sans',ui-monospace,monospace;color:#dfeae4;background-color:#0a0806;background-image:url("/_blob/9eb210e033e27fef99b3b1dc11476e9d"),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%),linear-gradient(45deg,#120e08 25%,transparent 25%,transparent 75%,#120e08 75%);background-size:256px 256px,64px 64px,64px 64px;background-position:0 0,0 0,32px 32px;animation:bgmove 14s linear infinite}
@keyframes bgmove{to{background-position:256px 256px,256px 256px,288px 288px}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.stage h1,.stage h2,.stage h3,.stage p{margin:0;font-weight:inherit}
.bunting{position:absolute;top:0;left:0;right:0;z-index:3;height:24px;background:linear-gradient(#cf9b38,#cf9b38) 0 0/100% 6px no-repeat,conic-gradient(from -45deg at bottom,#cf9b38 90deg,transparent 0) 0 6px/32px 18px repeat-x}
.panel{background:#15100a;border:3px solid #cf9b38;box-shadow:0 0 0 3px #000,6px 6px 0 3px rgba(0,0,0,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;box-sizing:border-box;font-family:inherit;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;background:#cf9b38;color:#0a0806;box-shadow:inset -4px -4px 0 #9a6f1f,inset 4px 4px 0 #f0cf7a,0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.7)}
.btn:hover{background:#e0ad46}
.btn:focus-visible{outline:3px solid #dfeae4;outline-offset:5px}
.btn-ghost{background:#211910;color:#ecc062;box-shadow:inset -4px -4px 0 #0a0806,inset 4px 4px 0 #3a2c18,0 0 0 3px #cf9b38,5px 5px 0 3px rgba(0,0,0,.7)}
.btn-ghost:hover{background:#2b2014}
.btn-sm{min-height:44px;font-size:18px;padding:0 16px;box-shadow:inset -3px -3px 0 #0a0806,inset 3px 3px 0 #3a2c18,0 0 0 2px #cf9b38,4px 4px 0 2px rgba(0,0,0,.7)}
.label{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#b9a780}
.seed{width:100%;box-sizing:border-box;height:72px;padding:0 20px;background:#0a0806;border:3px solid #cf9b38;color:#ecc062;font-family:inherit;font-weight:700;font-size:40px;letter-spacing:.14em;text-transform:uppercase;outline:0;box-shadow:inset 4px 4px 0 #000}
.seed:focus-visible{outline:3px solid #dfeae4;outline-offset:4px}
.mode{display:flex;flex-direction:column;gap:2px;align-items:flex-start;flex:1;padding:10px 14px;box-sizing:border-box;font-family:inherit;color:#dfeae4;background:#15100a;border:3px solid #4a3a1c;cursor:pointer;text-align:left}
.mode:hover{border-color:#7a5a1e}
.mode[aria-pressed="true"]{border-color:#cf9b38;background:#211910}
.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;border-bottom:2px dashed #3a2c18}
.spr{position:relative;flex:none;display:block;width:calc(48px*var(--s,3));height:calc(64px*var(--s,3));background-image:var(--spr);background-repeat:no-repeat;background-size:calc(var(--sw)*var(--s,3)) calc(var(--sh)*var(--s,3));background-position:calc(var(--col,0)*-48px*var(--s,3)) calc(var(--row,0)*-64px*var(--s,3));image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.65))}
.jk{--spr:url("/_blob/e43ea6237996aacaca58fe6b0f8bb5c0");--sw:96px;--sh:64px}
.oscuro .jk{--spr:url("/_blob/507f130c5d0337cce8a1efee24cdb017")}
.gear{position:absolute;z-index:30;right:24px;bottom:22px;width:60px;height:60px;min-height:60px;padding:0;flex-direction:column;gap:3px}
.gear svg{width:24px;height:24px}
.gear .k{font-size:11px;letter-spacing:.12em;line-height:1}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}

    <div style="display:flex;flex-direction:column">

      <div class="rec" style="border-bottom:0"><span style="font-size:22px;font-weight:600;letter-spacing:.1em">B0TT-C4RD</span><span style="font-size:16px;color:#b9a780">Mesa 1 · 1 840 pts</span><button class="btn btn-ghost btn-sm" type="button" style="min-height:36px;font-size:15px;padding:0 12px">Usar</button></div>
